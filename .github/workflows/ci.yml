# BUILD-9 — the one gated CI/publish workflow (design: docs/design/build_release_process.md).
# Replaces backend-health.yml + frontend-health.yml + build-images.yml.
#
# Shape (bridge-aligned):
#   push/PR   → path-filtered fast gates: ledger-guard / backend-health / frontend-health —
#               plus contract-guard + pin staleness on EVERY push (no path gate, HK-13).
#   dispatch  → the SAME gates (forced for the areas being published) + image publishing:
#               a targets × languages matrix for the backend images (default: all 6) and the
#               multi-arch config-ui image — each publish job `needs:` its green health job
#               AND the contract-guard job (release staleness gate: a pin trailing its owner
#               by a minor or major blocks the publish), so an image can never be published
#               from a red or contract-stale tree.
#
# Naming (D-2): RU images keep the unsuffixed names (locveil-voice-armv7 …); EN adds `-en`.
# Guards (D-6): a published image FAILS the run if /app/assets is non-empty (models must
# never be baked) and its size is reported + checked against a per-target budget.
#
# Publish everything:  gh workflow run CI            (defaults: all targets × both languages)
# One image:           gh workflow run CI -f targets=armv7 -f languages=en

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: "Backend targets to publish"
        type: choice
        options: [all, armv7, aarch64, standalone]
        default: all
      languages:
        description: "Languages to publish"
        type: choice
        options: [all, ru, en]
        default: all
      build_backend:
        description: "Publish backend images"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  # Event name in the key so a push never cancels a manual publish dispatch.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # What changed? A commit only pays for the checks it earns.           #
  # ------------------------------------------------------------------ #
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ui: ${{ steps.filter.outputs.ui }}
      ledger: ${{ steps.filter.outputs.ledger }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'config/**'
              - 'docker/**'
              - '.github/workflows/ci.yml'
              # Layer 2 must run whenever a contract moves (process/contracts.md §4,
              # HK-13/BUILD-47): backend-health is the only job that runs pytest — the
              # conformance / version / drift tests — so every pin, STAMP and owned
              # artifact path that lives OUTSIDE backend/ is listed here. (The vendored
              # core-py copy is already under backend/**.) A new owned artifact outside
              # backend/ or contracts/ adds its path in the same change.
              - 'contracts/**'
              - 'docs/guides/websocket-api.md'
              - 'docs/guides/tracing.md'
              - 'docs/manifest.json'
              - 'config-ui/openapi.json'
              - 'scripts/dump_openapi.py'
              # workbench pin conformance (BUILD-53) reads the manifest-fragment source
              - 'config-ui/manifest.fragment.json'
              - 'config-ui/package.json'
              - 'config-ui/vite.config.ts'
            ui:
              - 'config-ui/**'
              - '.github/workflows/ci.yml'
            ledger:
              - 'docs/**'
              - 'CLAUDE.md'
              - 'scripts/scope_guard.py'
              - '.scope-guard.toml'
              - '.github/workflows/ci.yml'

  # ------------------------------------------------------------------ #
  # Ledger guard — single-task-ledger discipline, enforced in CI.       #
  # ------------------------------------------------------------------ #
  ledger-guard:
    needs: changes
    if: needs.changes.outputs.ledger == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ledger discipline guard (scope-guard, vendored at scope-v7.3.1)
        run: python3 scripts/scope_guard.py --config .scope-guard.toml --check

  # ------------------------------------------------------------------ #
  # Contract guard — layer-1 contract coherence (layout, registry,      #
  # STAMP/PIN shape, pin hashes, content drift). process/contracts.md  #
  # §4. Runs on EVERY push/PR/dispatch — NO path gate (HK-13): owned    #
  # artifacts mostly live outside contracts/, so a gated job never ran  #
  # for the edit the drift rule exists to catch.                        #
  # ------------------------------------------------------------------ #
  contract-guard:
    runs-on: ubuntu-latest
    steps:
      # Full history: repin's touch-the-family diffs HEAD against the push/PR base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The TAG-MISSING / STAMP-DRIFT rules resolve owned STAMP tags via `git tag -l` /
      # `git show <tag>:…`. `fetch-tags: true` is NOT enough: checkout@v4 ignores it on
      # its fetch-by-SHA path (run 29417879036 proved it — the fetch carried no tag
      # refspec). The explicit fetch is version-proof.
      - name: Fetch tags (checkout@v4 ignores fetch-tags on the SHA path)
        run: git fetch --tags origin
      - name: "Contract coherence guard (contract-guard v4.0.0, vendored; strict: no --relax-tags, the pushed tag must exist)"
        run: python3 scripts/contract_guard.py --check
      # Staleness ladder (process/contracts.md §5, BUILD-51). Ordinary pushes fail only on
      # a MAJOR family gap or on touch-the-family: a commit that edits a pin folder or
      # its conformance test while that pin trails its owner. Tag lookup is tokenless
      # `git ls-remote` on the owners' public repos; the commons catalog destination is
      # skipped here (no sibling checkout in CI), never counted never-pinned.
      - name: "Pin staleness (repin v2.0.0, vendored): fail-on major + touch-the-family"
        if: github.event_name != 'workflow_dispatch'
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$PR_BASE" ]; then
            BASE="origin/$PR_BASE"
          else
            BASE="$PUSH_BASE"
          fi
          # A branch's first push has an all-zero `before`: nothing to diff against.
          if [ -n "$BASE" ] && [ -z "$(printf '%s' "$BASE" | tr -d '0')" ]; then BASE=""; fi
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            python3 scripts/repin.py --check --fail-on major --touched "$BASE"
          else
            python3 scripts/repin.py --check --fail-on major
          fi
      # Image dispatch = a release act: a family trailing by a MINOR or MAJOR blocks the
      # publish (publish-backend `needs:` this job); patch and vendored-tool gaps warn —
      # a commons tool tag must never block a hotfix image (HK-13 q6).
      - name: "Release staleness gate (image dispatch): fail-on minor"
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/repin.py --check --fail-on minor

  # ------------------------------------------------------------------ #
  # Backend health — shared py-dev-gates trio + the voice-specific      #
  # gate suite + pytest. Gates every backend image publish.             #
  # ------------------------------------------------------------------ #
  backend-health:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Shared gates (import-linter + check-no-type-checking + pyright), same composite
      # action the bridge uses. Installs the project with pip; `all` pulls every provider
      # extra so pyright can type-check the full provider surface.
      - name: Python health gates (py-dev-gates)
        uses: droman42/py-dev-gates/.github/actions/python-health@v0.1.1
        with:
          # src-layout under backend/ (BUILD-36): the project is rooted in backend/,
          # the import package is backend/src/locveil_voice.
          working-directory: backend
          src: src/locveil_voice
          install-extras: "all,dev"
          # Explicit: the repo's .python-version is a gitignored LOCAL pin (absent in CI),
          # and the action falls back to reading it when no version is given.
          python-version: "3.11"

      # The lockfile is still the source of truth for reproducible installs even though
      # the gate env above is pip-resolved — verify it hasn't drifted from pyproject.
      - name: Lockfile consistency (uv lock --check)
        working-directory: backend
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv lock --check

      # The tools auto-detect the repo/data root by config/config-master.toml, so they run
      # from the checkout root; the package is already installed (editable) by py-dev-gates.
      - name: Build-analyzer profile validation
        run: python -m locveil_voice.tools.build_analyzer --validate-all-profiles

      - name: Config validation (master + profiles)
        run: python -m locveil_voice.tools.config_validator_cli --config-dir config/ --ci-mode

      # QUAL-67: donation schema + contract↔code wiring, warnings-as-errors — every declared
      # param must be read, every _handle_* method declared. The QUAL-66 zero-warning
      # baseline is what makes warnings failable here.
      - name: Donation validation (schema + contract wiring, warnings-as-errors)
        run: python -m locveil_voice.tools.donation_validator_cli --ci-mode

      - name: Dependency validation (providers x platforms)
        run: python -m locveil_voice.tools.dependency_validator --validate-all --platforms linux.ubuntu,linux.alpine

      - name: Architecture gate — armv7 profile stays torch-free (ARCH-24 T3)
        run: python -m locveil_voice.tools.build_analyzer --config config/embedded-armv7.toml --arch armv7l

      # Run from the checkout root (several tests resolve repo-root data like config/
      # cwd-relative); backend/pyproject.toml supplies pytest settings + rootdir.
      - name: Tests
        run: python -m pytest -c backend/pyproject.toml backend/tests/ -q

  # ------------------------------------------------------------------ #
  # Frontend health — the config-ui gate (UI-17: config-ui is the       #
  # Voice Workbench PLUGIN; `build` = the ESM lib + manifest fragment). #
  # ------------------------------------------------------------------ #
  frontend-health:
    needs: changes
    if: >-
      needs.changes.outputs.ui == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: locveil-voice/config-ui
    steps:
      # config-ui consumes sibling `file:` deps from locveil-commons (locveil-ui-kit,
      # locveil-workbench contract types — the dev-phase consumption model), so the
      # gate needs BOTH repos checked out side by side, and the kit's dist built.
      - uses: actions/checkout@v4
        with:
          path: locveil-voice
      - uses: actions/checkout@v4
        with:
          repository: locveil/locveil-commons
          path: locveil-commons
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: locveil-voice/config-ui/package-lock.json
      - name: Build locveil-ui-kit (sibling dep)
        working-directory: locveil-commons/packages/ui-kit
        run: npm ci && npm run build
      # The workbench contract ships as SOURCE types (exports "./contract" →
      # src/contract.ts), so voice's tsc type-checks that file and it resolves
      # `react` from the workbench's own tree — which must therefore be installed.
      - name: Install locveil-workbench deps (contract.ts type resolution)
        working-directory: locveil-commons/packages/workbench
        run: npm ci
      - run: npm ci
      - name: Type-check + lint + orphans
        run: npm run check
      - name: Build
        run: npm run build
      - name: Tests
        run: npm run test

  # ------------------------------------------------------------------ #
  # Publish plan — expand the dispatch inputs into the build matrix.    #
  # ------------------------------------------------------------------ #
  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.build_backend
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: python
        run: |
          import json, os

          TARGETS = {
              "armv7":      {"dockerfile": "docker/Dockerfile.armv7",   "platform": "linux/arm/v7",
                             "profile": "embedded-armv7",   "image": "locveil-voice-armv7"},
              "aarch64":    {"dockerfile": "docker/Dockerfile.aarch64", "platform": "linux/arm64",
                             "profile": "embedded-aarch64", "image": "locveil-voice-aarch64"},
              "standalone": {"dockerfile": "docker/Dockerfile.x86_64",  "platform": "linux/amd64",
                             "profile": "standalone-x86_64", "image": "locveil-voice-standalone"},
          }
          # D-6 size budgets (bytes, uncompressed) — set from the FIRST real publish
          # (BUILD-11, 2026-07-06): armv7 248 MB, aarch64 718 MB, standalone 2.86 GB.
          # Roughly 2x/1.4x headroom for dependency growth; a breach means a silent
          # multi-hundred-MB regression, not normal drift.
          BUDGETS = {"armv7": 500_000_000, "aarch64": 1_500_000_000, "standalone": 4_000_000_000}

          want_targets = "${{ inputs.targets }}"
          want_langs = "${{ inputs.languages }}"
          targets = list(TARGETS) if want_targets == "all" else [want_targets]
          languages = ["ru", "en"] if want_langs == "all" else [want_langs]

          include = []
          for t in targets:
              base = TARGETS[t]
              for lang in languages:
                  # D-2: RU keeps the unsuffixed names/profiles; EN adds `-en`.
                  suffix = "" if lang == "ru" else "-en"
                  include.append({
                      "target": t, "language": lang,
                      "dockerfile": base["dockerfile"], "platform": base["platform"],
                      "profile": base["profile"] + suffix, "image": base["image"] + suffix,
                      "budget": BUDGETS[t],
                  })
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")

  # ------------------------------------------------------------------ #
  # Backend images — manual only, gated on green backend-health.        #
  # ------------------------------------------------------------------ #
  publish-backend:
    needs: [backend-health, contract-guard, plan]
    if: github.event_name == 'workflow_dispatch' && inputs.build_backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=v{{date 'YYYYMMDD'}}-{{sha}}

      - name: Build + push (${{ matrix.target }}/${{ matrix.language }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            CONFIG_PROFILE=${{ matrix.profile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.language }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.language }}

      # D-6: models must NEVER be baked. The image ships an EMPTY /app/assets (all
      # ASR/TTS/wake models download at runtime into the mounted assets root); a non-empty
      # dir means someone baked assets/models — fail the publish loudly. Size is budgeted
      # so a silent multi-GB regression is caught here, not on the WB7's flash.
      - name: "Guard: no baked assets + size budget (D-6)"
        run: |
          REF="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
          docker pull --platform ${{ matrix.platform }} "$REF"

          COUNT=$(docker run --rm --platform ${{ matrix.platform }} --entrypoint sh "$REF" \
                    -c 'ls -A /app/assets | wc -l')
          echo "/app/assets entries: $COUNT"
          if [ "$COUNT" -ne 0 ]; then
            echo "::error::Image ships a non-empty /app/assets — models/assets must not be baked (D-6)"
            exit 1
          fi

          SIZE=$(docker image inspect "$REF" --format '{{.Size}}')
          SIZE_H=$(numfmt --to=iec "$SIZE")
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- uncompressed size: **${SIZE_H}** (budget: $(numfmt --to=iec ${{ matrix.budget }}))" >> "$GITHUB_STEP_SUMMARY"
          echo "- /app/assets: empty ✅" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "${{ matrix.budget }}" ]; then
            echo "::error::Image size ${SIZE_H} exceeds the ${{ matrix.target }} budget"
            exit 1
          fi

  # NB (UI-17): the config-ui nginx image (locveil-voice-ui) is RETIRED with the
  # standalone app — config-ui ships as a Workbench plugin bundle consumed by the
  # commons shell at runtime; published bundle URLs are a productization-step act.
