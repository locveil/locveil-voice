# repin config for locveil-voice (BUILD-43; repin v2 since BUILD-51 — vendored
# scripts/repin.py, never edit the vendored file, `repin.py tool repin` to move).
# Families this repo CONSUMES + the vendored-tools manifest. NO `files` lists: the pin
# file set is what the OWNER's STAMP enumerates at the tag (HK-13). Every `conformance`
# is a repo-root-relative path that resolves in the repo holding the pin. Severity ladder
# (../locveil-commons/process/contracts.md §5): pre-commit warns (--fail-on none);
# push CI runs --fail-on major --touched <base> (touch-the-family); release / image
# dispatch and `make -C eval repin-check` run --fail-on minor (patch + tool gaps warn).

[repin]
pinned_by = "locveil-voice scripts/repin.py (BUILD-51)"
default_fail_on = "major"

# BUILD-34/TEST-17: the local push-time pin and the commons crossover copy move together
# in ONE run at one tag, so they can never diverge (multi-dest; a cross-repo dest is
# legal ONLY into ../locveil-commons — HK-12 ruling, enforced by the tool).
[[family]]
name = "catalog"
owner_repo = "locveil-bridge"
owner_dir = "../locveil-bridge"
owner_url = "https://github.com/locveil/locveil-bridge.git"
mirror = ["bridge_commit", "catalog_version"]
[[family.dest]]
path = "contracts/pins/catalog"
conformance = "backend/tests/test_catalog_contract_conformance.py"
[[family.dest]]
path = "../locveil-commons/contracts/pins/catalog"
conformance = "eval/tests/test_contracts_pin.py"   # resolves in the DEST repo (commons root)

[[family]]
name = "report-protocol"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
[[family.dest]]
path = "contracts/pins/report-protocol"
conformance = "backend/tests/test_report_protocol_conformance.py"

[[family]]
name = "esp32-site"
owner_repo = "locveil-satellite"
owner_dir = "../locveil-satellite"
owner_url = "https://github.com/locveil/locveil-satellite.git"
[[family.dest]]
path = "contracts/pins/esp32-site"
conformance = "backend/tests/test_arch36_tls_e2e.py"

# ARCH-58: the estate's FIRST vendored RUNTIME code — strict byte-identity pin (owner
# ruling). The importable copy at backend/src/locveil_voice/utils/entry_point_loader.py must stay
# byte-identical to the pinned artifact; the conformance test asserts it.
[[family]]
name = "core-py"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
[[family.dest]]
path = "contracts/pins/core-py"
conformance = "backend/tests/test_core_py_pin_identity.py"

# BUILD-52 (HK-13 decision 6): docs/manifest.json is instance data; the CONTRACT is the
# commons-owned schema it validates against. The manifest test reads the pinned copy —
# hermetic, no sibling checkout, no skip in CI.
[[family]]
name = "docs-manifest-schema"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
[[family.dest]]
path = "contracts/pins/docs-manifest-schema"
conformance = "backend/tests/test_docs_manifest.py"

# Vendored-tools manifest (HK-12; v2 shape HK-13): `path` is where the vendored copy
# lives; `pinned_tag` + `sha256` are WRITTEN by `repin.py tool <name>` in a re-vendor
# ledger task — the copy is verified against the recorded hash (a locally edited tool
# fails), and the tag is checked against the owner's newest on the same ladder.
[[tool]]
name = "scope-guard"
path = "scripts/scope_guard.py"
family = "scope"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
pinned_tag = "scope-v7.3.1"
sha256 = "294cf4111c7e3e1914b6014c88d99558e3cebaeb736341110208d39bf1e76ba7"

[[tool]]
name = "contract-guard"
path = "scripts/contract_guard.py"
family = "contract-guard"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
pinned_tag = "contract-guard-v4.0.0"
sha256 = "51e2a0d1599a2b8e1c3d50538d4f1b4684d8314bc0931b9998d02f36206f74fd"

[[tool]]
name = "repin"
path = "scripts/repin.py"
family = "repin"
owner_repo = "locveil-commons"
owner_dir = "../locveil-commons"
owner_url = "https://github.com/locveil/locveil-commons.git"
pinned_tag = "repin-v2.0.0"
sha256 = "2e55faa86fe17763610ad1d4280df3daf1de8892d1620149dfc0ffcb876d30c4"
